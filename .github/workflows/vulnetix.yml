      - uses: Vulnetix/cli/sbom@v4.24.1
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sca
          fail-on-findings: false

  publish:
    name: Publish
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: ${{ !cancelled() }}
    needs: [secrets, sca-bun, sca-bundler, sca-cargo, sca-cocoapods, sca-composer, sca-go, sca-gradle, sca-hex, sca-maven, sca-npm, sca-nuget, sca-pip, sca-pipenv, sca-pnpm, sca-poetry, sca-pub, sca-swift, sca-uv, sca-yarn, iac, containers, license, cbom, aibom, analyze, sbom]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/gha-upload@v4.24.1
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false
